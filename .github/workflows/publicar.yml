# Publicación del SDK de Java (docs/api/43 §2.13 y §2.14). Escrita, NO activa. Un tag `v*` la dispara; el environment `publicacion` exige la
# aprobación del dueño. Maven Central NO tiene trusted publishing: usa el token del Central Portal y la llave GPG, que se guardan como secretos
# del environment `publicacion` (CENTRAL_USERNAME, CENTRAL_PASSWORD, GPG_PRIVATE_KEY, GPG_PASSPHRASE). Antes: registrar y verificar el namespace
# `si.trevol` en https://central.sonatype.com (registro TXT en el DNS de trevol.si) y publicar la llave pública GPG en keys.openpgp.org.
name: Publicar
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  maven-central:
    runs-on: ubuntu-latest
    environment: publicacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - run: mvn -B verify
      - name: El tag coincide con la versión del paquete
        run: test "v$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" = "${GITHUB_REF_NAME}"
      - name: Publicar (fuentes, javadoc, firma GPG y subida al Central Portal)
        run: mvn -B -Ppublicar -DskipTests deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
